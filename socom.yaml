socom: '0.1'
project: socom
domains:
- protocol
- cli
- canon
checks:
  fast: tests/smoke.sh
  medium: tests/smoke.sh && python3 tests/xmlcheck.py
  full: tests/smoke.sh && python3 tests/xmlcheck.py && ./bin/socom index . >/dev/null && echo full-ok
  eval: ./bin/socom cycle --gate --threshold 70
ci:
  status: 'echo ''bind me: cache-free pipeline state query'''
seats:
  builder:
    runtime: claude-code
    model: default
  reviewer:
    runtime: claude-code
    model: different-family-preferred
