socom: '0.1'
project: socom
domains:
- protocol
- cli
- canon
checks:
  fast: tests/smoke.sh
  medium: tests/smoke.sh && python3 -c "import xml.etree.ElementTree as ET,glob; [ET.parse(f) for f in glob.glob('canon/*.xml')+glob.glob('schemas/*.xml')+glob.glob('.socom/canon/*.xml')]; print('xml well-formed')"
  full: tests/smoke.sh && ./bin/socom index . >/dev/null && echo full-ok
  eval: ./bin/socom cycle --gate --threshold 70
ci:
  status: 'echo ''bind me: cache-free pipeline state query'''
seats:
  builder:
    runtime: claude-code
    model: default
  reviewer:
    runtime: claude-code
    model: different-family-preferred
