socom: '0.1'
project: socom
domains:
- protocol
- cli
- canon
checks:
  fast: tests/smoke.sh
  medium: tests/smoke.sh && python3 tests/xmlcheck.py && python3 tests/ledgercheck.py && ./bin/socom context verify
  full: tests/smoke.sh && python3 tests/xmlcheck.py && python3 tests/ledgercheck.py && ./bin/socom context verify && ./bin/socom index . >/dev/null && echo full-ok
  eval: ./bin/socom cycle --gate --threshold 70
ci:
  status: 'echo ''bind me: cache-free pipeline state query'''
limits:
  # Phase-1 runaway guard: monarch kills a single --exec run past this many seconds
  # and records it broken (the runaway-spend backstop for unsupervised work). 0
  # disables the kill; the 72h staleness reaper still applies. Raise for long builds.
  max_runtime_s: 3600
seats:
  builder:
    runtime: claude-code
    model: default
  reviewer:
    runtime: claude-code
    model: different-family-preferred
